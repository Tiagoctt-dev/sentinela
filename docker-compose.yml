# Só o Postgres roda em Docker. Backend e frontend rodam localmente
# (uvicorn --reload / npm run dev) — sem container no meio, reload instantâneo
# igual ao fluxo normal de dev. Ver README > "Uso local (recomendado pro dia a dia)".
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinela
      POSTGRES_PASSWORD: sentinela
      POSTGRES_DB: sentinela
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinela"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Perfil "full": sobe backend e frontend em container (uso de demonstração/homologação).
  #   docker compose --profile full up --build
  # Defina SENTINELA_SECRET_KEY no ambiente para fixar a chave de cifra dos segredos (ou mantenha o volume `appdata`).
  backend:
    profiles: ["full"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinela:sentinela@postgres:5432/sentinela
      SENTINELA_SECRET_KEY: ${SENTINELA_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data

  frontend:
    profiles: ["full"]
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  appdata:
